name: Madar
options:
  bundleIdPrefix: com.alqzan.madar2
  deploymentTarget:
    iOS: '27.0'
  developmentLanguage: ar
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.2'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: V8YZL4R65K
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: true
packages:
  MadarCore:
    path: Packages/MadarCore
  MadarMoney:
    path: Packages/MadarMoney
  MadarData:
    path: Packages/MadarData
  MadarDesign:
    path: Packages/MadarDesign
  MadarSnapshots:
    path: Packages/MadarSnapshots
  MadarCommands:
    path: Packages/MadarCommands
  MadarQuran:
    path: Packages/MadarQuran
  MadarPrayer:
    path: Packages/MadarPrayer
  MadarInbox:
    path: Packages/MadarInbox
  MadarSync:
    path: Packages/MadarSync
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    version: 3.11.1
targets:
  Madar:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - QuranRoom.swift
      - Intents
      - Widgets/NextPrayerWidget.swift
    dependencies:
      - package: MadarCore
      - package: MadarData
      - package: MadarDesign
      - package: MadarSnapshots
      - package: MadarCommands
      - package: MadarMoney
      - package: MadarPrayer
      - package: MadarQuran
      - package: MadarInbox
      - package: MadarSync
      - package: Readium
        product: ReadiumNavigator
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - target: MadarWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alqzan.madar2
        # Empty: local-only build that never opens CloudKit. `make cloud-device` sets it with Madar-CloudKit.entitlements.
        MADAR_CLOUDKIT_CONTAINER: ''
        MADAR_APP_ENTITLEMENTS: App/Madar.entitlements
        CODE_SIGN_ENTITLEMENTS: $(MADAR_APP_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: مدار
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleURLTypes:
          - CFBundleURLName: com.alqzan.madar2
            CFBundleURLSchemes: [madar]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: امسح باركود الكتاب وصوّر صفحة الفهرس على هذا الجهاز.
        NSFaceIDUsageDescription: افتح بيانات مدار المحمية بمصادقة الجهاز.
        NSLocationWhenInUseUsageDescription: يعرف مدار أنك خارج مدينتك ليسألك عن السفر، ويملأ مدينتك حين تضغط «استخدم موقعي». لا يحفظ مدار موقعك؛ ولمعرفة اسم المدينة يرسل النظام الموقع إلى Apple مرة واحدة عند طلبك ذلك.
        NSHealthShareUsageDescription: يقرأ مدار الخطوات أو دقائق الحركة التي تختارها لحساب عادة المشي؛ لا يكتب في تطبيق الصحة.
        NSHealthUpdateUsageDescription: لا يكتب مدار أي بيانات في تطبيق الصحة؛ يقرأ فقط الخطوات أو دقائق الحركة التي تسمح بها.
        NSMicrophoneUsageDescription: سجّل صوتك واحفظه في صفحة يومك على هذا الجهاز.
        NSPhotoLibraryUsageDescription: يعرض مدار صور يومك من تطبيق الصور لتضيف منها ما تشاء، ويحفظ رابطها ونسخة صغيرة منها فقط.
        NSSpeechRecognitionUsageDescription: حوّل التسجيل الذي تختاره إلى نص. لا يُرسل الصوت إلى Apple دون موافقتك داخل مدار.
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers: [com.alqzan.madar2.backup]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.alqzan.madar2.backupset
            UTTypeDescription: نسخة مدار التلقائية
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [madarbackupset]
        UIBackgroundModes: [processing]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        MadarCloudKitContainer: $(MADAR_CLOUDKIT_CONTAINER)
        UIAppFonts:
          - thmanyahsans-Light.otf
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahserifdisplay-Bold.otf
          - thmanyahserifdisplay-Black.otf
          - thmanyahseriftext-Regular.otf
          - thmanyahseriftext-Bold.otf
          - Amiri-Regular.ttf
          - Amiri-Bold.ttf
          - Literata-Variable.ttf
          - SourceSerif4-Variable.ttf
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - IBMPlexSerif-Regular.ttf
          - IBMPlexSerif-Bold.ttf
    # App/Madar.entitlements (App Group + HealthKit) is kept as a file; CODE_SIGN_ENTITLEMENTS picks it or, in the
    # paid iCloud build, App/Madar-CloudKit.entitlements through MADAR_APP_ENTITLEMENTS.
  MadarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - App/PrayerActivityAttributes.swift
      - Intents/LogPrayerIntent.swift
      - Intents/OpenQuickRoomIntent.swift
      - Intents/PrayerControlIntent.swift
      - Intents/StartQuranSessionIntent.swift
      - Intents/StartPrayerActivityIntent.swift
      - App/QuranWidgetContent.swift
      - App/RoomWidgetContent.swift
      - App/WidgetMakerContent.swift
      - App/MadarGlyph.swift
      - Intents/WidgetCompleteHabitIntent.swift
      - App/MoneyWidgetContent.swift
      - App/Resources/RoomSymbols.xcassets
    dependencies:
      - package: MadarSnapshots
      - package: MadarInbox
      - package: MadarCore
      - package: MadarDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alqzan.madar2.widgets
        GENERATE_INFOPLIST_FILE: true
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: مدار
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/MadarWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.alqzan.madar2]
  MadarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Integration]
    dependencies:
      - package: MadarQuran
      - target: Madar
      - package: MadarData
      - package: MadarCore
      - package: MadarSnapshots
      - package: MadarCommands
      - package: MadarMoney
      - package: MadarInbox
      - package: MadarPrayer
  MadarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
      - path: Packages/MadarCore/Tests/MadarCoreTests/Fixtures/dayone-synthetic.zip
        buildPhase: resources
      - path: Tests/Fixtures/Mihbara/arabic-reader-poc.epub
        buildPhase: resources
      - path: Tests/Fixtures/Mihbara/english-import-poc.epub
        buildPhase: resources
      - path: Tests/Fixtures/Mihbara/scan-order-poc.epub
        buildPhase: resources
    dependencies:
      - target: Madar
schemes:
  Madar:
    build:
      targets:
        Madar: all
    test:
      targets: [MadarTests, MadarUITests]
